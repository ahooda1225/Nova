<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Hormonal Health Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #fdf4f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .page-label {
    font-family: 'DM Serif Display', serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: #b8748e;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
  }

  .nova-app {
    width: 100%;
    max-width: 420px;
    border-radius: 28px;
    border: 0.5px solid #e8d0da;
    overflow: hidden;
    background: white;
    display: flex;
    flex-direction: column;
    height: 680px;
    box-shadow: 0 8px 40px rgba(180, 90, 120, 0.12);
  }

  .nova-header {
    background: #f9f0f4;
    padding: 16px 20px 12px;
    border-bottom: 0.5px solid #e8d5df;
  }

  .nova-header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .nova-logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4748e, #c45a76);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
  }

  .nova-name {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: #4a1b2e;
    letter-spacing: 0.02em;
  }

  .nova-subtitle {
    font-size: 11px;
    color: #9e6b7d;
    margin-top: 1px;
  }

  .simulate-label {
    font-size: 10px;
    color: #b89aaa;
    margin-bottom: 5px;
    letter-spacing: 0.04em;
  }

  .phase-strip {
    display: flex;
    gap: 6px;
  }

  .phase-pill {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
    color: #9e6b7d;
    background: white;
    font-family: 'DM Sans', sans-serif;
  }

  .phase-pill.active {
    background: #d4748e;
    color: white;
    border-color: #c45a76;
  }

  .phase-pill:not(.active):hover { background: #f0dde5; }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fdf8fa;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #e8d0da; border-radius: 4px; }

  .msg-row { display: flex; gap: 8px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4748e, #c45a76);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    color: white;
    font-size: 12px;
    flex-shrink: 0;
  }

  .msg-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 13.5px;
    line-height: 1.55;
  }

  .msg-row.nova .msg-bubble {
    background: white;
    color: #3d1a28;
    border: 0.5px solid #ecd5de;
    border-bottom-left-radius: 4px;
  }

  .msg-row.user .msg-bubble {
    background: #d4748e;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg-time {
    font-size: 10px;
    color: #b89aaa;
    margin-top: 3px;
    padding: 0 4px;
  }

  .msg-row.user .msg-time { text-align: right; }

  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 10px 14px;
    background: white;
    border: 0.5px solid #ecd5de;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d4748e;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .quick-replies {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 16px 8px;
  }

  .quick-reply {
    padding: 6px 12px;
    border-radius: 16px;
    border: 1px solid #e0bfcc;
    background: white;
    font-size: 12px;
    color: #9e4d6a;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .quick-reply:hover { background: #f9eef2; border-color: #d4748e; }

  .chat-input-area {
    padding: 10px 14px 14px;
    background: white;
    border-top: 0.5px solid #ecd5de;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .chat-input {
    flex: 1;
    border: 1px solid #e0bfcc;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 13.5px;
    font-family: 'DM Sans', sans-serif;
    color: #3d1a28;
    background: #fdf8fa;
    outline: none;
    resize: none;
    line-height: 1.4;
    min-height: 38px;
    max-height: 90px;
    overflow-y: auto;
  }

  .chat-input:focus { border-color: #d4748e; background: white; }
  .chat-input::placeholder { color: #c9a0b0; }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #d4748e;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: #c45a76; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }

  .phase-context-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fbeef3;
    border: 0.5px solid #e8c5d3;
    border-radius: 12px;
    padding: 3px 9px;
    font-size: 11px;
    color: #9e4d6a;
    align-self: flex-start;
  }

  .phase-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d4748e;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 14px;
    font-size: 11px;
    color: #c9a0b0;
    text-align: center;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<p class="page-label">Nova — AI Prototype</p>

<div class="nova-app" role="main">
  <div class="nova-header">
    <div class="nova-header-top">
      <div class="nova-logo" aria-hidden="true">N</div>
      <div>
        <div class="nova-name">Nova</div>
        <div class="nova-subtitle">your hormonal health companion</div>
      </div>
    </div>
    <div class="simulate-label">simulate phase →</div>
    <div class="phase-strip" id="phaseStrip" role="tablist" aria-label="Cycle phase selector">
      <div class="phase-pill active" data-phase="menstrual" onclick="setPhase(this)" role="tab" tabindex="0">Menstrual</div>
      <div class="phase-pill" data-phase="follicular" onclick="setPhase(this)" role="tab" tabindex="0">Follicular</div>
      <div class="phase-pill" data-phase="ovulation" onclick="setPhase(this)" role="tab" tabindex="0">Ovulation</div>
      <div class="phase-pill" data-phase="luteal" onclick="setPhase(this)" role="tab" tabindex="0">Luteal</div>
    </div>
  </div>

  <div class="chat-area" id="chatArea" role="log" aria-live="polite"></div>

  <div class="quick-replies" id="quickReplies"></div>

  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="message Nova..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)" aria-label="Message input"></textarea>
    <button class="send-btn" onclick="sendMessage()" aria-label="Send message">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<p class="footer-note">ECE 80B · Ananya Hooda · UC Santa Cruz</p>

<script>
const phases = {
  menstrual: {
    badge: "day 2 · menstrual phase · via Apple Watch",
    welcome: "hey! noticed your HRV's been a bit low and your sleep was lighter last night. totally makes sense for where you are in your cycle right now. how are you feeling?",
    quick: ["i'm so tired", "why is my HRV low?", "what should i eat?"],
    responses: {
      "i'm so tired": "yeah that's so real right now. estrogen and progesterone are both at their lowest this week, so your energy is just... not there. and you're losing iron on top of it. honestly this is a rest week — lighter movement, extra sleep, iron-rich foods. not the week to push through.",
      "why is my HRV low?": "your nervous system is under more stress than usual — inflammation, cramping, the hormonal drop all kind of gang up on it. it'll bounce back once you hit your follicular phase. i'll let you know when i see it trending back up!",
      "what should i eat?": "iron is your best friend right now — lentils, spinach, red meat if you eat it. magnesium helps with cramps (dark chocolate counts lol). and omega-3s to keep inflammation down. also maybe go easy on caffeine on heavier days, it can make cramping worse."
    }
  },
  follicular: {
    badge: "day 8 · follicular phase · via Apple Watch",
    welcome: "ok your HRV is already trending back up and your sleep last night was way better. you're in your follicular phase now — estrogen's rising and most people start feeling like themselves again. what's going on?",
    quick: ["why do i feel so good?", "best time to work out?", "how long does this last?"],
    responses: {
      "why do i feel so good?": "rising estrogen! it boosts serotonin, improves sleep, sharpens focus. you're basically in your peak productivity window right now. your brain is genuinely more tuned in. lean into it.",
      "best time to work out?": "honestly this is your strongest window of the whole cycle. estrogen helps with muscle repair and your pain tolerance is higher. great time for strength training, HIIT, trying something new. your body can handle more right now.",
      "how long does this last?": "follicular runs about 7-8 days, so you've got a bit! then you'll hit ovulation, which is kind of the peak of this whole good-energy stretch. i'll flag when it looks like you're getting close."
    }
  },
  ovulation: {
    badge: "day 14 · ovulation window · via skin temp",
    welcome: "your temp's been creeping up the last two days — looks like you're hitting your ovulation window. estrogen peaks here, so a lot of people feel their most confident and social. how are you doing?",
    quick: ["what does my data show?", "will i crash after this?", "i feel really social"],
    responses: {
      "what does my data show?": "your skin temp is up about 0.3°C over the last two days, which is pretty classic pre-ovulatory. HRV is at its highest point this cycle and your sleep efficiency's been great. everything's looking really on track.",
      "will i crash after this?": "there's often a mild shift when you move into the luteal phase — progesterone rises and some people feel it as fatigue or mood changes. nothing dramatic, just a gear shift. i'll keep an eye on your data and give you a heads up when i see it starting.",
      "i feel really social": "that's so on-cycle honestly. the estrogen + small testosterone spike around ovulation genuinely increases confidence and wanting to connect. it's one of the most well-studied hormonal behavior effects. good time for presentations, hard conversations, putting yourself out there."
    }
  },
  luteal: {
    badge: "day 22 · luteal phase · via HRV + temp",
    welcome: "you're in your luteal phase — progesterone's running the show now. your HRV's dipped a little and your resting temp is up slightly, which is normal. some people feel more tired or moody this week. how are you holding up?",
    quick: ["i've been so irritable", "why the cravings?", "is this PMS?"],
    responses: {
      "i've been so irritable": "that irritability is genuinely hormonal, not just you. progesterone breaks down into a neurosteroid that can mess with mood stability, especially in the back half of the luteal phase. it tends to peak around days 24-26. consistent sleep, cutting back on alcohol, and magnesium can actually help a lot.",
      "why the cravings?": "serotonin drops in the luteal phase and carbs give it a quick boost — so your body is literally asking for a mood fix. chocolate cravings also make sense because magnesium drops before your period. honestly honoring them a little is fine. your body's not being dramatic.",
      "is this PMS?": "basically yeah — PMS is just the cluster of symptoms that come with the luteal phase hormone drop. mood stuff, bloating, fatigue, cravings. if it's really intense and disrupting your life, that's worth mentioning to a doctor (it can tip into PMDD). tracking it with me over a few cycles will help us see if there's a consistent pattern."
    }
  }
};

let currentPhase = 'menstrual';

function initChat(phase) {
  const p = phases[phase];
  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = '';

  const badge = document.createElement('div');
  badge.className = 'phase-context-badge';
  badge.innerHTML = `<div class="phase-dot"></div><span>${p.badge}</span>`;
  chatArea.appendChild(badge);

  appendNovaMsg(p.welcome);

  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  p.quick.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = q;
    btn.onclick = () => sendQuick(q);
    qr.appendChild(btn);
  });
}

function setPhase(el) {
  document.querySelectorAll('.phase-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  currentPhase = el.dataset.phase;
  initChat(currentPhase);
}

function getTime() {
  return new Date().toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'});
}

function appendNovaMsg(text) {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row nova';
  row.innerHTML = `<div class="msg-avatar" aria-hidden="true">N</div><div><div class="msg-bubble">${text}</div><div class="msg-time">${getTime()}</div></div>`;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendUserMsg(text) {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div><div class="msg-bubble">${text}</div><div class="msg-time">${getTime()}</div></div>`;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row nova';
  row.id = 'typingRow';
  row.innerHTML = `<div class="msg-avatar" aria-hidden="true">N</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function sendQuick(text) {
  appendUserMsg(text);
  document.getElementById('quickReplies').innerHTML = '';
  showTyping();
  const p = phases[currentPhase];
  const reply = p.responses[text] || getFallback(text);
  setTimeout(() => { removeTyping(); appendNovaMsg(reply); }, 1400);
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  appendUserMsg(text);
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickReplies').innerHTML = '';
  showTyping();
  const reply = getSmartReply(text);
  setTimeout(() => { removeTyping(); appendNovaMsg(reply); }, 1600);
}

function getSmartReply(text) {
  const t = text.toLowerCase();
  const p = phases[currentPhase];
  const matchKey = Object.keys(p.responses).find(k => {
    const words = k.toLowerCase().split(' ').filter(w => w.length > 3);
    return words.some(w => t.includes(w));
  });
  if (matchKey) return p.responses[matchKey];
  return getFallback(text);
}

function getFallback(text) {
  const t = text.toLowerCase();
  if (t.includes('sleep') || t.includes('tired') || t.includes('exhaust')) {
    return "your sleep data's been a little lighter than your baseline this week. that's often tied to where you are in your cycle — i'll keep tracking and flag if it keeps trending that way.";
  }
  if (t.includes('cramp') || t.includes('pain')) {
    return "cramps are basically prostaglandins making your uterus contract. heat therapy actually works really well — studies show it's as effective as ibuprofen for mild-to-moderate pain. anti-inflammatory foods help too, ginger and omega-3s especially.";
  }
  if (t.includes('mood') || t.includes('anxious') || t.includes('stress') || t.includes('anxiety')) {
    return "mood and anxiety are so tied to your cycle — estrogen and progesterone directly affect serotonin and GABA, which are literally your anxiety regulators. it's not just stress, it's physiological. tracking it over a few cycles will help us figure out your personal pattern.";
  }
  if (t.includes('workout') || t.includes('exercise') || t.includes('gym')) {
    return "your best training windows shift across the cycle. right now in your " + currentPhase + " phase, i'd adjust intensity accordingly — i can go into more detail if you want to know what to focus on.";
  }
  return "based on where you are in your cycle right now, that's worth paying attention to. tell me more about what you're noticing and i can give you more specific insight!";
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

document.querySelectorAll('.phase-pill').forEach(pill => {
  pill.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPhase(pill); }
  });
});

initChat('menstrual');
</script>
</body>
</html>
